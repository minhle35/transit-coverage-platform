# Pre-commit hooks: run locally before git push
# Catches issues early, prevents broken code from reaching CI
#
# Install: pre-commit install
# Run manually: pre-commit run --all-files
# Update: pre-commit autoupdate

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3.12
        files: ^backend/

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ['--profile=black', '--line-length=100']
        files: ^backend/

  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: ['--max-line-length=100', '--extend-ignore=E203,W503']
        files: ^backend/
        additional_dependencies: [flake8-docstrings]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, --check-untyped-defs]
        files: ^backend/(src/app/loaders|src/transitcov)/
        additional_dependencies:
          - geopandas
          - pandas
          - shapely
          - numpy
          - sqlalchemy
          - geoalchemy2
          - psycopg

  # Custom: run pytest on changed files
  - repo: local
    hooks:
      - id: pytest-loader-tests
        name: pytest loader tests
        entry: bash -c 'cd backend && uv run pytest tests/test_loader_*.py -v --tb=short'
        language: system
        stages: [commit]
        pass_filenames: false
        always_run: true
        exclude: '\.lock$'

      - id: pytest-transitcov-tests
        name: pytest transitcov tests
        entry: bash -c 'cd backend/src/transitcov && uv run pytest tests/ -v --tb=short'
        language: system
        stages: [commit]
        pass_filenames: false
        always_run: true
        exclude: '\.lock$'
