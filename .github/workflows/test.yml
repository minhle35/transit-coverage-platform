name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: transit_user
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: transit
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          uv sync
          uv pip install -e src/transitcov

      - name: Run Alembic migrations
        working-directory: backend
        env:
          TRANSIT_DB_HOST: localhost
          TRANSIT_DB_PORT: 5432
          TRANSIT_DB_USER: transit_user
          TRANSIT_DB_PASSWORD: postgres
          TRANSIT_DB_NAME: transit
        run: |
          uv run python -m alembic upgrade head

      - name: Run backend loader tests
        working-directory: backend
        env:
          TRANSIT_DB_HOST: localhost
          TRANSIT_DB_PORT: 5432
          TRANSIT_DB_USER: transit_user
          TRANSIT_DB_PASSWORD: postgres
          TRANSIT_DB_NAME: transit
        run: |
          uv run python -m pytest tests/test_loader_*.py -v --tb=short

      - name: Run transitcov library tests (pure functions, no DB)
        working-directory: backend/src/transitcov
        run: |
          uv run python -m pytest tests/ -v --tb=short

      - name: Test import boundaries
        working-directory: backend
        env:
          TRANSIT_DB_HOST: localhost
          TRANSIT_DB_PORT: 5432
          TRANSIT_DB_USER: transit_user
          TRANSIT_DB_PASSWORD: postgres
          TRANSIT_DB_NAME: transit
        run: |
          # Verify transitcov has no imports from app/models/loaders/queries
          uv run python -c "
          import ast
          import sys
          from pathlib import Path

          transitcov_dir = Path('src/transitcov/src/transitcov')
          forbidden = {'app', 'sqlalchemy', 'psycopg', 'fastapi'}

          for py_file in transitcov_dir.rglob('*.py'):
              tree = ast.parse(py_file.read_text())
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          if any(alias.name.startswith(f) for f in forbidden):
                              print(f'ERROR: {py_file} imports {alias.name}')
                              sys.exit(1)
                  elif isinstance(node, ast.ImportFrom):
                      if node.module and any(node.module.startswith(f) for f in forbidden):
                          print(f'ERROR: {py_file} imports from {node.module}')
                          sys.exit(1)
          print('✓ Import boundaries OK: transitcov has no app/db imports')
          "

      - name: Generate coverage report
        working-directory: backend
        run: |
          uv run pytest tests/test_loader_*.py --cov=src/app --cov-report=term-missing --cov-report=html
          uv run pytest src/transitcov/tests/ --cov=src/transitcov --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/htmlcov
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        working-directory: backend
        run: |
          uv sync
          uv pip install -e src/transitcov

      - name: Check imports with isort
        working-directory: backend
        run: |
          uv run python -m isort --check-only src/ || true

      - name: Lint with flake8
        working-directory: backend
        run: |
          uv run python -m flake8 src/ --max-line-length=100 --count --statistics || true

  type-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        working-directory: backend
        run: |
          uv sync
          uv pip install -e src/transitcov

      - name: Type check with mypy
        working-directory: backend
        run: |
          uv run python -m mypy src/app/loaders/feed_version.py src/transitcov/src/transitcov/ --ignore-missing-imports || true
