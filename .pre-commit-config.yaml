# Pre-commit hooks: run locally before git push
# Catches issues early, prevents broken code from reaching CI
#
# Install: pre-commit install
# Run manually: pre-commit run --all-files
# Update: pre-commit autoupdate

repos:
  # Basic file checks (no external dependencies)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key

  # Code formatting (Python)
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3.12
        files: ^backend/

  # Import sorting
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ['--profile=black', '--line-length=100']
        files: ^backend/

  # Linting (without external dependencies to avoid pip issues)
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: ['--max-line-length=100', '--extend-ignore=E203,W503']
        files: ^backend/

# ======= MANUAL CHECKS (run separately) =======
#
# Type checking (mypy):
#   cd backend && uv run mypy src/app/loaders/ src/transitcov/src/transitcov/ --ignore-missing-imports
#
# Unit tests (no database needed, fast):
#   cd backend/src/transitcov && uv run pytest tests/ -v
#
# Integration tests (requires PostgreSQL):
#   cd backend && uv run pytest tests/test_loader_*.py -v
#
# All checks (same as CI):
#   pre-commit run --all-files  # Formatting, linting
#   uv run mypy src/ --ignore-missing-imports  # Type checking
#   uv run pytest tests/ --tb=short  # Tests
