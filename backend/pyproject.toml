[project]
name = "app"
version = "0.1.0"
description = "Backend for transit coverage scoring library and REST API for Greater Melbourne"
authors = [
    { email = "118033201+minhle35@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "apache-airflow>=3.3.2",
    "apache-airflow-providers-postgres>=7.1.1",
    "fastapi>=0.136.3",
    "geoalchemy2>=0.20.0",
    "geopandas>=1.2.0",
    "httpx>=0.24.0",
    "matplotlib>=3.11.2",
    "numpy>=1.24",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyproj>=3.8.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "shapely>=2.2.0",
    "sqlalchemy>=2.1.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
start-app = "src.main:app"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["app", "transitcov"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__main__.py",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
